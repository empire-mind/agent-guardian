# Ruff configuration for agent-guardian
line-length = 88
target-version = "py310"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = []

[lint.isort]
known-first-party = ["guardian"]

[format]
quote-style = "double"
indent-style = "space"
